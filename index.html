<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>IBC Play BAY – Watch Free</title>
<meta name="description" content="IBC Play BAY OTT channel. Watch reality shows and series free, no registration.">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0b0b;--pink:#f2327c;--mute:#b3b3b3}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:#fff;font:16px/1.5 Poppins,system-ui,sans-serif;padding-bottom:env(safe-area-inset-bottom,0)}
:focus-visible{outline:3px solid #ffc857;outline-offset:2px}
nav{position:fixed;top:0;left:0;right:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:calc(14px + env(safe-area-inset-top,0px)) 4% 14px;background:linear-gradient(#000c,#0000)}
nav.solid{background:#0b0b0b}
.brand{font-weight:800;font-size:1.5rem;text-decoration:none;color:#fff;letter-spacing:.5px}
.brand b{color:var(--pink)}
nav input{background:#000a;border:1px solid #555;color:#fff;border-radius:4px;padding:8px 12px;font:inherit;width:min(260px,50vw)}
.hero{position:relative;min-height:78vh;display:flex;align-items:flex-end;padding:0 4% 9vh;background:#1a1a1a center/cover no-repeat}
.hero:before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#0b0b0bf2 0,#0b0b0b66 55%,#0000),linear-gradient(#0000 55%,var(--bg))}
.hero>div{position:relative;max-width:560px}
.hero small{color:var(--pink);font-weight:700}
.hero h1{font-size:clamp(2rem,5.5vw,4rem);line-height:1.1;margin:6px 0 12px;font-weight:800}
.hero p{color:#ddd;margin:0 0 20px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.btn{background:#fff;color:#000;border:0;border-radius:6px;padding:11px 30px;font:700 1.05rem Poppins;cursor:pointer}
.btn:hover{background:#ddd}
.rows{margin-top:-8vh;position:relative;padding-bottom:60px}
.row{margin:0 0 30px}
.row h2{font-size:1.25rem;margin:0 4% 10px;font-weight:600}
.wrap{position:relative}
.rail{display:flex;gap:8px;overflow-x:auto;padding:10px 4% 28px;scroll-snap-type:x proximity;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.card{flex:0 0 clamp(190px,22vw,300px);background:none;border:0;padding:0;color:inherit;text-align:left;cursor:pointer;scroll-snap-align:start;transition:transform .2s}
.card:hover,.card:focus-visible{transform:scale(1.1);z-index:5}
.th{aspect-ratio:16/9;border-radius:6px;background:linear-gradient(135deg,#2a2a2a,var(--pink)) center/cover;display:grid;place-items:center;font:800 2.2rem Poppins}
.card h3{font-size:.9rem;font-weight:500;margin:8px 2px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card span{font-size:.78rem;color:var(--mute);margin:0 2px}
.arrow{position:absolute;top:0;bottom:28px;width:4%;min-width:34px;border:0;background:#000a;color:#fff;font-size:2rem;cursor:pointer;z-index:6;opacity:0;transition:opacity .2s}
.wrap:hover .arrow{opacity:1}
.arrow.l{left:0}.arrow.r{right:0}
@media(hover:none){.arrow{display:none}}
.res{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:22px;padding:110px 4% 60px}
.res h2{grid-column:1/-1;margin:0}
.msg{padding:130px 4%;color:var(--mute);font-size:1.1rem}
dialog{width:min(960px,96vw);background:#141414;color:#fff;border:0;border-radius:10px;padding:0;overflow:hidden}
dialog::backdrop{background:#000d}
.player{aspect-ratio:16/9;width:100%;display:block;border:0;background:#000}
.info{padding:16px 22px 24px}.info h2{margin:0 0 4px}.info .m{color:var(--mute);font-size:.9rem}
.x{position:absolute;top:10px;right:10px;z-index:3;width:38px;height:38px;border-radius:50%;border:0;background:#000b;color:#fff;font-size:1.1rem;cursor:pointer}
footer{padding:26px 4%;color:var(--mute);font-size:.85rem;border-top:1px solid #222}
.hero.empty{background:radial-gradient(circle at 78% 35%,#f2327c55,#0000 55%),#0b0b0b;min-height:70vh}
.btn:disabled{background:#333;color:#aaa;cursor:default}
.soonc{cursor:default}.soonc:hover{transform:none}
.th.soon{flex-direction:column;gap:4px;font:700 .8rem Poppins;color:#ffffffb0;letter-spacing:.5px}
.th.soon b{font-size:1.05rem;color:#fff}
.soonc:nth-child(2n) .th{background:linear-gradient(135deg,#1b1b1b,#7a1b45)}
.soonc:nth-child(3n) .th{background:linear-gradient(135deg,#222,#3b2a6b)}
.soonc:nth-child(5n) .th{background:linear-gradient(135deg,#1a1a1a,#b52a62)}
</style>
</head>
<body>
<nav id="nav"><a class="brand" href="./">IBC PLAY <b>BAY</b></a><input id="q" type="search" placeholder="Search" aria-label="Search videos"></nav>
<div id="app"></div>
<footer>© IBC Play BAY. Watch free. No registration.</footer>

<dialog id="dlg" aria-label="Video player">
  <button class="x" id="x" aria-label="Close">✕</button>
  <div id="stage"></div>
  <div class="info"><h2 id="vt"></h2><div class="m" id="vm"></div><p id="vd"></p></div>
</dialog>

<script>
const $=s=>document.querySelector(s);
let videos=[];
const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const yt=u=>{const m=String(u).match(/(?:youtu\.be\/|v=|shorts\/|embed\/)([\w-]{11})/);return m&&m[1]};
const thumbOf=v=>v.thumb||(v.type==='youtube'&&yt(v.src)?`https://img.youtube.com/vi/${yt(v.src)}/hqdefault.jpg`:'');

fetch('videos.json?t='+Date.now()).then(r=>r.json()).then(d=>{videos=Array.isArray(d)?d:[];home()})
 .catch(()=>$('#app').innerHTML='<p class="msg">Videos could not be loaded. Please refresh.</p>');

const card=v=>{const t=thumbOf(v);return `<button class="card" data-id="${esc(v.id)}"><div class="th" ${t?`style="background-image:url('${esc(t)}')"`:''}>${t?'':esc(v.title.charAt(0))}</div><h3>${esc(v.title)}</h3><span>${esc([v.category,v.language].filter(Boolean).join(' • '))}</span></button>`};
const row=(t,l)=>`<section class="row"><h2>${esc(t)}</h2><div class="wrap"><button class="arrow l" aria-label="Scroll left">‹</button><div class="rail">${l.map(card).join('')}</div><button class="arrow r" aria-label="Scroll right">›</button></div></section>`;

function home(){
  if(!videos.length){
    const tiles=Array.from({length:7},()=>'<div class="card soonc"><div class="th soon"><b>IBC PLAY BAY</b>Coming soon</div></div>').join('');
    $('#app').innerHTML=`<header class="hero empty"><div><small>Launching soon</small><h1>Your next favourite show. Free.</h1><p>Reality shows, series and original stories from IBC Play BAY. No sign-up. No subscription.</p><button class="btn" disabled>Coming soon</button></div></header><main class="rows"><section class="row"><h2>Coming soon</h2><div class="wrap"><div class="rail">${tiles}</div></div></section></main>`;return}
  const h=videos[0],t=thumbOf(h);
  let html=`<header class="hero" ${t?`style="background-image:url('${esc(t)}')"`:''}><div><small>${esc(h.category||'Now streaming')}</small><h1>${esc(h.title)}</h1><p>${esc(h.desc)}</p><button class="btn" data-id="${esc(h.id)}">▶ Play</button></div></header><main class="rows">`;
  html+=row('New on IBC Play BAY',videos.slice(0,12));
  [...new Set(videos.map(v=>v.category).filter(Boolean))].forEach(c=>html+=row(c,videos.filter(v=>v.category===c)));
  $('#app').innerHTML=html+'</main>';
}
$('#q').oninput=e=>{
  const q=e.target.value.trim().toLowerCase();
  if(!q)return home();
  const l=videos.filter(v=>(v.title+' '+(v.desc||'')+' '+(v.category||'')+' '+(v.language||'')).toLowerCase().includes(q));
  $('#app').innerHTML=`<div class="res"><h2>Results for “${esc(q)}”</h2>${l.length?l.map(card).join(''):'<p class="msg" style="padding:30px 0">No videos found.</p>'}</div>`;
};
$('#app').onclick=e=>{
  const a=e.target.closest('.arrow');
  if(a){const r=a.parentNode.querySelector('.rail');r.scrollBy({left:(a.classList.contains('l')?-1:1)*r.clientWidth*.85,behavior:'smooth'});return}
  const c=e.target.closest('[data-id]');if(c)play(videos.find(v=>v.id===c.dataset.id));
};
addEventListener('scroll',()=>$('#nav').classList.toggle('solid',scrollY>40));

function play(v){
  if(!v)return;
  const id=v.type==='youtube'&&yt(v.src);
  $('#stage').innerHTML=id
   ?`<iframe class="player" src="https://www.youtube-nocookie.com/embed/${id}?autoplay=1&rel=0" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen title="${esc(v.title)}"></iframe>`
   :`<video class="player" src="${esc(v.src)}" ${v.thumb?`poster="${esc(v.thumb)}"`:''} controls autoplay playsinline></video>`;
  $('#vt').textContent=v.title;
  $('#vm').textContent=[v.category,v.language,v.date].filter(Boolean).join(' • ');
  $('#vd').textContent=v.desc||'';
  $('#dlg').showModal();
}
const stop=()=>$('#dlg').close();
$('#x').onclick=stop;
$('#dlg').addEventListener('close',()=>$('#stage').innerHTML='');
$('#dlg').addEventListener('click',e=>{if(e.target.id==='dlg')stop()});
</script>
</body>
</html>
