<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>IBC Play BAY – Watch Free</title>
<meta name="description" content="IBC Play BAY OTT channel. Watch reality shows and series free, no registration.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&family=DM+Sans:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <header class="top">
    <a class="brand" href="./">IBC Play <b>BAY</b></a>
  </header>
  <section class="hero">
    <h1>Press play. No sign-up.</h1>
    <p>Reality shows, series and original stories from IBC Play BAY. Pick a video and watch.</p>
  </section>
  <div class="bar">
    <input id="q" type="search" placeholder="Search videos" aria-label="Search videos">
    <div class="chips" id="chips" role="group" aria-label="Categories"></div>
  </div>
  <main class="grid" id="grid" aria-live="polite"></main>
</div>
<footer><div class="wrap">© IBC Play BAY. All rights reserved.</div></footer>

<dialog id="dlg" aria-label="Video player">
  <button class="close" id="close" aria-label="Close player">✕</button>
  <div id="stage"></div>
  <div class="info"><h2 id="vt"></h2><p class="meta" id="vm"></p><p id="vd"></p></div>
</dialog>

<script>
const $=s=>document.querySelector(s);
let videos=[],cat='All';
const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

fetch('videos.json?t='+Date.now()).then(r=>r.json()).then(d=>{videos=Array.isArray(d)?d:[];chips();render()})
  .catch(()=>{$('#grid').innerHTML='<p class="empty">Videos could not be loaded. Please refresh the page.</p>'});

function chips(){
  const cats=['All',...new Set(videos.map(v=>v.category).filter(Boolean))];
  $('#chips').innerHTML=cats.map(c=>`<button class="chip" aria-pressed="${c===cat}" data-c="${esc(c)}">${esc(c)}</button>`).join('');
}
$('#chips').onclick=e=>{const b=e.target.closest('.chip');if(!b)return;cat=b.dataset.c;chips();render()};
$('#q').oninput=render;

function render(){
  const q=$('#q').value.toLowerCase();
  const list=videos.filter(v=>(cat==='All'||v.category===cat)&&(v.title+' '+(v.desc||'')+' '+(v.language||'')).toLowerCase().includes(q));
  $('#grid').innerHTML=list.length?list.map(v=>`
    <button class="card" data-id="${esc(v.id)}">
      <div class="thumb" ${v.thumb?`style="background-image:url('${esc(v.thumb)}')"`:''}>${v.thumb?'':esc(v.title.charAt(0))}</div>
      <h3>${esc(v.title)}</h3>
      <div class="meta"><span class="tag">${esc(v.category||'Video')}</span>${v.language?' • '+esc(v.language):''}</div>
    </button>`).join(''):'<p class="empty">'+(videos.length?'No videos match your search.':'New videos are coming soon.')+'</p>';
}
$('#grid').onclick=e=>{const c=e.target.closest('.card');if(c)play(videos.find(v=>v.id===c.dataset.id))};

function yt(u){const m=u.match(/(?:youtu\.be\/|v=|shorts\/|embed\/)([\w-]{11})/);return m&&m[1]}
function play(v){
  if(!v)return;
  const id=v.type==='youtube'&&yt(v.src);
  $('#stage').innerHTML=id
    ?`<iframe class="player" src="https://www.youtube-nocookie.com/embed/${id}?autoplay=1&rel=0" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen title="${esc(v.title)}"></iframe>`
    :`<video class="player" src="${esc(v.src)}" ${v.thumb?`poster="${esc(v.thumb)}"`:''} controls autoplay playsinline></video>`;
  $('#vt').textContent=v.title;
  $('#vm').textContent=[v.category,v.language,v.date].filter(Boolean).join(' • ');
  $('#vd').textContent=v.desc||'';
  $('#dlg').showModal();
}
function stop(){$('#stage').innerHTML='';$('#dlg').close()}
$('#close').onclick=stop;
$('#dlg').addEventListener('close',()=>$('#stage').innerHTML='');
$('#dlg').addEventListener('click',e=>{if(e.target.id==='dlg')stop()});
</script>
</body>
</html>
